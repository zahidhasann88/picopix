<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>picopix — vanilla Vite demo</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>picopix</h1>
      <p class="lede">
        Drop an image to resize, convert and compress it — the pixel work runs in a
        Web Worker. Everything here is ordinary app code, not library code.
      </p>

      <form id="controls" class="controls">
        <label>
          Max edge
          <input id="maxEdge" type="number" min="16" max="4096" step="16" value="800" />
        </label>
        <label>
          Format
          <select id="format">
            <option value="webp" selected>WebP</option>
            <option value="jpeg">JPEG</option>
            <option value="png">PNG</option>
            <option value="avif">AVIF (if supported)</option>
          </select>
        </label>
        <label>
          Target size (KB)
          <input id="maxSizeKB" type="number" min="1" max="20000" value="120" />
        </label>
        <label class="checkbox">
          <input id="strip" type="checkbox" checked />
          Strip metadata
        </label>
      </form>

      <div id="dropzone" class="dropzone" tabindex="0">
        <input id="file" type="file" accept="image/*" hidden />
        <p><strong>Drop an image</strong> or click to choose a file</p>
        <p class="hint">Nothing is uploaded — the browser does everything locally.</p>
      </div>

      <p id="status" class="status" role="status"></p>

      <section id="result" class="result" hidden>
        <figure>
          <figcaption>Original <span id="originalMeta"></span></figcaption>
          <img id="original" alt="original" />
        </figure>
        <figure>
          <figcaption>Processed <span id="processedMeta"></span></figcaption>
          <img id="processed" alt="processed" />
        </figure>
        <a id="download" class="download" download="processed">Download</a>
      </section>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
