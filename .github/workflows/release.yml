name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: verify and create GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check that package.json, tag and CHANGELOG agree
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "package.json version: $PKG_VERSION"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            echo "tag version: $TAG"
            test "$PKG_VERSION" = "$TAG" || { echo "::error::tag v$TAG does not match package version $PKG_VERSION"; exit 1; }
          fi
          grep -q "## \[$PKG_VERSION\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [${PKG_VERSION}] section"; exit 1; }

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Worker thread tests against the build
        run: pnpm exec vitest run tests/worker.thread.test.ts

      - name: Install Chromium and run real browser checks
        run: |
          pnpm exec playwright-core install --with-deps chromium
          pnpm run test:browser

      - name: Pack
        run: pnpm pack

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: '*.tgz'
          if-no-files-found: error

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: '*.tgz'
          body_path: CHANGELOG.md
