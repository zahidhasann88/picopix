name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck (strict, DOM lib)
        run: pnpm run typecheck

      - name: Unit + integration tests
        run: pnpm test

      - name: Build (tsdown, multi-entry)
        run: pnpm run build

      - name: Worker-over-a-real-thread tests (needs dist/)
        run: pnpm exec vitest run tests/worker.thread.test.ts

      - name: Benchmarks (smoke)
        run: pnpm run bench

      - name: Bundle sizes
        run: pnpm run size

      - name: Package contents
        run: pnpm pack --dry-run

  browser:
    name: real browser tests (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Install Chromium
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Browser checks (OffscreenCanvas, module Worker, WebP encode)
        run: pnpm run test:browser

  demo:
    name: example builds (vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Build the vanilla Vite example against the built package
        working-directory: examples/vanilla-vite
        run: |
          pnpm install --ignore-workspace
          pnpm exec vite build
