name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck (strict, DOM lib)
        run: npm run typecheck

      - name: Unit + integration tests
        run: npm test

      - name: Build (tsup, multi-entry)
        run: npm run build

      - name: Worker-over-a-real-thread tests (needs dist/)
        run: npx vitest run tests/worker.thread.test.ts

      - name: Benchmarks (smoke)
        run: npm run bench

      - name: Bundle sizes
        run: npm run size

      - name: Package contents
        run: npm pack --dry-run

  browser:
    name: real browser tests (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser checks (OffscreenCanvas, module Worker, WebP encode)
        run: npm run test:browser

  demo:
    name: example builds (vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Build the vanilla Vite example against the built package
        working-directory: examples/vanilla-vite
        run: |
          npm install --no-audit --no-fund
          npx vite build
